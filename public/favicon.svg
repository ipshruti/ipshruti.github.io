    <path d="M-2 40 C8 32 16 34 26 38 C34 41 44 30 66 34 V44 H-2 Z" fill="#5a4f93" />
    <rect y="42" width="64" height="22" fill="url(#sea)" />
    <path d="M18 46 H30 M20 50 H28 M21 54 H27" stroke="#ffe2a0" stroke-width="2" stroke-linecap="round" />
    <path d="M38 64 C44 52 54 46 66 44 V64 Z" fill="#1b2546" />
