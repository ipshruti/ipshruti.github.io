<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The home page landscape in miniature: sunset sky, low sun, hills, water. -->
  <defs>
    <clipPath id="tile"><rect width="64" height="64" rx="14" /></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c7a2" />
      <stop offset="0.55" stop-color="#e89196" />
      <stop offset="1" stop-color="#b07aa8" />
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6aa6" />
      <stop offset="1" stop-color="#262f5c" />
    </linearGradient>
    <radialGradient id="glow" cx="0.38" cy="0.6" r="0.4">
      <stop offset="0" stop-color="#ffe2a0" stop-opacity="0.9" />
      <stop offset="1" stop-color="#ffe2a0" stop-opacity="0" />
    </radialGradient>
  </defs>
  <g clip-path="url(#tile)">
